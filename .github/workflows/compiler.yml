name: Build RedFox Recovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3

      - name: Init Repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH=$HOME/bin:$PATH
          mkdir -p ~/work/TWRP
          cd ~/work/TWRP
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --depth=1
          repo sync -j8 --force-sync --no-clone-bundle --no-tags

      - name: Build
        run: |
          cd ~/work/TWRP
          cp -r $GITHUB_WORKSPACE/device/realme/RMX3624 ~/work/TWRP/device/realme/RMX3624
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_RMX3624-eng
          make recoveryimage -j8

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: recovery
          path: ~/work/TWRP/out/target/product/RMX3624/recovery.img
