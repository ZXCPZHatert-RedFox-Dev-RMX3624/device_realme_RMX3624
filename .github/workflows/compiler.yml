name: RedFox Recovery Builder Realme RMX3624

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание вашего дерева устройства
        uses: actions/checkout@v4

      - name: Подготовка окружения и сборка OrangeFox
        uses: sushrut1101/twrp-dt-compiler@main
        with:
          MANIFEST_URL: https://github.com//minimal-manifest-twrp/platform_manifest_twrp_aosp.git
          MANIFEST_BRANCH: twrp-12.1
          DEVICE_TREE_URL: https://github.com{{ github.repository }}
          DEVICE_TREE_BRANCH: main
          DEVICE_PATH: device/realme/RMX3624
          DEVICE_NAME: RMX3624
          MAKEFILE_NAME: twrp_RMX3624
          BUILD_TARGET: recovery
