name: OrangeFox Recovery Builder
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cleanup Space
        run: |
          sudo docker image prune -a -f
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf image_utils lib32ncurses-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

      - name: Build OrangeFox
        run: |
          mkdir workspace && cd workspace
          git config --global user.name "Developer"
          git config --global user.email "dev@example.com"
          repo init --depth=1 -u https://github.com -b twrp-12.1
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags
          mkdir -p device/realme/RMX3624
          cp -r ../* device/realme/RMX3624/
          . build/envsetup.sh
          lunch twrp_RMX3624-eng || lunch omni_RMX3624-eng
          make clean
          mka recoveryimage -j$(nproc)

      - name: Upload Recovery
        uses: actions/upload-artifact@v4
        with:
          name: RedFox-Recovery-RealmeC33
          path: workspace/out/target/product/RMX3624/recovery.img
