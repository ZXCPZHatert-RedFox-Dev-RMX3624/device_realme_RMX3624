name: Build RedFox Recovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device/realme/RMX3624

      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "PATH=$HOME/bin:$PATH" >> $GITHUB_ENV

      - name: Init RedFox manifest
        run: |
          mkdir -p ~/work/RedFox
          cd ~/work/RedFox
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --depth=1
          repo sync -j8 --force-sync --no-clone-bundle --no-tags

      - name: Copy device tree
        run: |
          cp -r device/realme/RMX3624 ~/work/RedFox/device/realme/RMX3624

      - name: Build recovery
        run: |
          cd ~/work/RedFox
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_RMX3624-eng
          make recoveryimage -j8

      - name: Upload recovery
        uses: actions/upload-artifact@v4
        with:
          name: recovery.img
          path: ~/work/RedFox/out/target/product/RMX3624/recovery.img
