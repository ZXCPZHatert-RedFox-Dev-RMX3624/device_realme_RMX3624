name: RedFox Recovery Builder Realme RMX3624
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tree
        uses: actions/checkout@v4

      - name: Build Recovery inside Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/root/device_tree ubuntu:22.04 bash -c "
          apt-get update && apt-get install -y git curl python3 python3-pip repo bc bison build-essential ccache flex g++-multilib gcc-multilib gnupg gperf lib32ncurses-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev &&
          mkdir workspace && cd workspace &&
          git config --global user.name 'Developer' &&
          git config --global user.email 'dev@example.com' &&
          repo init --depth=1 -u https://github.com -b twrp-12.1 &&
          repo sync -c -j\$(nproc) --force-sync --no-clone-bundle --no-tags &&
          mkdir -p device/realme/RMX3624 &&
          cp -r /root/device_tree/* device/realme/RMX3624/ &&
          . build/envsetup.sh &&
          (lunch twrp_RMX3624-eng || lunch omni_RMX3624-eng) &&
          make clean &&
          mka recoveryimage -j\$(nproc) &&
          cp out/target/product/RMX3624/recovery.img /root/device_tree/
          "

      - name: Upload Recovery Image
        uses: actions/upload-artifact@v4
        with:
          name: RedFox-Recovery-RealmeC33
          path: recovery.img
